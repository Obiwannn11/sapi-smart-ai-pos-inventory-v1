<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — SAPI POS</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f7fbf9;
            color: #1f2b26;
            padding: 24px;
        }
        .card {
            max-width: 340px;
            text-align: center;
        }
        img { width: 72px; height: 72px; margin-bottom: 20px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { font-size: 14px; line-height: 1.5; color: #5b6b64; margin: 0 0 24px; }
        button {
            appearance: none;
            border: 0;
            background: #0d9668;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            padding: 11px 22px;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover { background: #0b8259; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="SAPI POS">
        <h1>Anda sedang offline</h1>
        <p>Tidak ada koneksi internet. Periksa jaringan Anda, lalu coba muat ulang halaman.</p>
        <button onclick="location.reload()">Coba lagi</button>
    </div>
</body>
</html>
