<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — SAPI POS</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f7fbf9;
            color: #1f2b26;
            padding: 24px;
        }
        .card {
            max-width: 340px;
            text-align: center;
        }
        img { width: 72px; height: 72px; margin-bottom: 20px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { font-size: 14px; line-height: 1.5; color: #5b6b64; margin: 0 0 24px; }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: stretch;
        }
        button, .btn {
            appearance: none;
            border: 0;
            background: #0d9668;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            padding: 11px 22px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        button:hover, .btn:hover { background: #0b8259; }
        .btn-secondary {
            background: transparent;
            color: #0d9668;
            border: 1px solid #cfe6dc;
        }
        .btn-secondary:hover { background: #eef7f3; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="SAPI POS">
        <h1>Anda sedang offline</h1>
        <p>Tidak ada koneksi internet. Kasir tetap bisa dibuka dan menerima pembayaran tunai — penjualannya tersimpan lalu terkirim saat sinyal kembali.</p>
        <!--
            Tautan kasir ini bukan hiasan ([BL-096]). Halaman ini adalah cadangan
            terakhir service worker untuk SETIAP rute yang tidak tercache — akar
            situs termasuk. Tanpa tautan ini, kasir yang membuka aplikasi dari
            keadaan mati mendarat di sini dan berhenti, padahal /cashier/pos ada
            di cache dan siap dibuka. Jangan cabut tanpa menyediakan jalan lain
            menuju POS.
        -->
        <div class="actions">
            <a class="btn" href="/cashier/pos">Buka Kasir</a>
            <button class="btn-secondary" onclick="location.reload()">Coba lagi</button>
        </div>
    </div>
</body>
</html>
